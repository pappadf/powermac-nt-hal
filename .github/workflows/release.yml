# Copyright (C) 2026 powermac-nt-hal contributors
#
# A release: the boot floppy, built from this tree alone, published as a GitHub Release and on
# GitHub Pages.  Nothing on the floppy is Microsoft's -- the ARC firmware is src/arcfw, the HAL
# and the ADB driver are this project's -- so the image may be redistributed (GPL-2.0-only).
#
# Runs on a version tag (v1.0, v1.0.1, ...), pushed with git or made on the Releases page, or
# by hand.  Pages needs the repository's Pages source set to "GitHub Actions" once (Settings >
# Pages); until then the Pages job fails and the Release still goes out.
#
# The Pages site keeps every release: https://<owner>.github.io/<repo>/vX.Y/ is that release's
# page for good, the root is the newest one with the list of all.  A deployment replaces the
# whole site, so the pages job rebuilds it every time from what persists -- each published
# Release's assets and each tag's docs/HOWTO.md (tools/mkpages.py) -- never from the previous
# deployment.  A run by hand off a branch publishes no new release and rebuilds the site from
# the existing ones (a repair); its own build is not put on it.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install clang and lld
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18

      - name: Version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME}"; else v="snapshot-$(git rev-parse --short HEAD)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build everything and the floppy
        run: |
          make
          make floppy
          make disk

      - name: Check what came out
        run: |
          set -e
          for f in build/hal.dll build/adbport.sys build/arcfw.xcf build/boot-floppy.img; do test -f "$f"; done
          python3 tools/pe-exports.py build/hal.dll | grep -q '01f0\|0x1f0'
          python3 tools/pe-exports.py build/adbport.sys | grep -q '01f0\|0x1f0'
          # arcfw.xcf: an XCOFF with big-endian headers (f_magic 0x01DF)
          test "$(head -c 2 build/arcfw.xcf | od -An -tx1 | tr -d ' ')" = 01df
          # the floppy must carry nothing of Microsoft's: no such 8.3 directory entry on it
          for e in 'VENEER  EXE' 'VENEERD EXE' 'SETUPLDR   ' 'CIRRUS  SYS' 'CIRRUS  DLL' 'I8042PRTSYS'; do
            ! grep -aq "$e" build/boot-floppy.img || { echo "$e is on the floppy"; exit 1; }
          done
          for e in 'ARCFW   XCF' 'HALSHINRDLL' 'ADBPORT SYS' 'BOOT    OF ' 'BOOTDISKOF ' 'RESTORE OF '; do
            grep -aq "$e" build/boot-floppy.img || { echo "$e is missing from the floppy"; exit 1; }
          done

      - name: Package
        run: |
          set -e
          v="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          cp build/boot-floppy.img "dist/powermac-nt-hal-$v-boot-floppy.img"
          mkdir -p "dist/parts"
          cp build/hal.dll build/adbport.sys build/arcfw.xcf dist/parts/
          (cd dist/parts && zip -q "../powermac-nt-hal-$v-parts.zip" hal.dll adbport.sys arcfw.xcf)
          rm -r dist/parts
          cp LICENSE NOTICE dist/
          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Release notes
        run: |
          v="${{ needs.build.outputs.version }}"
          {
            echo "## powermac-nt-hal $v"
            echo
            echo "The boot floppy for Windows NT 4.0 on the Apple Network Server 500/700, built from this tree alone."
            echo "Nothing on it is Microsoft's: the ARC firmware, the HAL and the ADB driver are this project's (GPL-2.0-only)."
            echo
            echo "- \`powermac-nt-hal-$v-boot-floppy.img\`: the 1.44 MB floppy. Write it, or attach it to the emulator."
            echo "- \`powermac-nt-hal-$v-parts.zip\`: \`hal.dll\`, \`adbport.sys\` and \`arcfw.xcf\` (the firmware the floppy carries) on their own."
            echo "- \`SHA256SUMS\`"
            echo
            echo "You still need a Network Server ROM (the production 1.1.22 or the 2.26NT one; both work) and your own Windows NT 4.0 Workstation for PowerPC CD."
            echo "[docs/HOWTO.md](https://github.com/${GITHUB_REPOSITORY}/blob/$v/docs/HOWTO.md) is the whole walk."
          } > notes.md
      # A tag pushed with git has no release yet: create one.  A tag made on the Releases page
      # ("Draft a new release", "Create new tag on publish") arrives with its release already
      # there: fill that one in, replacing any asset of the same name.  What a person wrote
      # there stays: the title and the notes are set only where they were left empty (v1.1's
      # hand-written notes were replaced by the generated ones before this).
      - name: Create or fill the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.build.outputs.version }}"
          if gh release view "$v" >/dev/null 2>&1; then
            gh release upload "$v" dist/* --clobber
            title="$(gh release view "$v" --json name --jq .name)"
            body="$(gh release view "$v" --json body --jq .body)"
            if [ -z "$title" ]; then gh release edit "$v" --title "powermac-nt-hal $v"; fi
            if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then gh release edit "$v" --notes-file notes.md; fi
          else
            gh release create "$v" dist/* --title "powermac-nt-hal $v" --notes-file notes.md
          fi

  pages:
    needs: [build, release]
    # after the Release on a tag (the site is built from the Releases), alone on a run by hand
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-24.04
    # one deployment at a time: two tags pushed together must not race each other's site
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # every tag, for each release's own HOWTO
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Every published Release (drafts are not), each with its assets and the HOWTO as of its
      # tag.  This run's own release comes from this run's build, which is what it uploaded.
      - name: Gather every release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          v="${{ needs.build.outputs.version }}"
          mkdir -p versions
          gh release list --limit 1000 --exclude-drafts --json tagName,isPrerelease,publishedAt \
            --jq '.[] | [.tagName, (.isPrerelease|tostring), (.publishedAt // "")[0:10]] | @tsv' > releases.tsv
          if [ "${GITHUB_REF_TYPE}" = tag ] && ! cut -f1 releases.tsv | grep -qx "$v"; then
            printf '%s\tfalse\t%s\n' "$v" "$(date -u +%F)" >> releases.tsv
          fi
          while IFS="$(printf '\t')" read -r tag pre date; do
            case "$tag" in v*) ;; *) echo "skipping $tag: not a v* tag"; continue ;; esac
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "skipping $tag: no such tag"; continue
            fi
            d="versions/$tag"
            mkdir -p "$d/download"
            if [ "$tag" = "$v" ]; then
              cp dist/* "$d/download/"
            else
              gh release download "$tag" --dir "$d/download"
            fi
            git show "$tag:docs/HOWTO.md" > "$d/HOWTO.md"
            printf '{"prerelease": %s, "date": "%s"}\n' "$pre" "$date" > "$d/meta.json"
            echo "$tag: $(ls "$d/download" | wc -l) files"
          done < releases.tsv
      - name: The site
        run: python3 tools/mkpages.py --versions versions --out site
      # The artifact is named per attempt: a re-run of this job after a failed deployment
      # (Pages not enabled yet, or its environment rule not allowing tags) uploads again, and
      # deploy-pages refuses a run holding two artifacts of one name (v1.0, attempt 3).
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
