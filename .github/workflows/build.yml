# SPDX-License-Identifier: GPL-2.0-only
# Copyright (C) 2026 powermac-nt-hal contributors
#
# Proves the central claim of this project: HAL.DLL, the ADB driver and the ARC firmware for
# Windows NT 4.0 PowerPC build from source with clang, lld and a Python script, no Microsoft
# tool anywhere in the build, and the boot floppy is laid out from them alone.
name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  hal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang and lld
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18

      - name: Build
        run: |
          make
          make floppy

      - name: Check what came out
        run: |
          set -e
          test -f build/hal.dll
          test -f build/adbport.sys
          test -f build/arcfw.xcf
          test -f build/boot-floppy.img
          python3 tools/pe-exports.py build/adbport.sys | grep -q '01f0\|0x1f0'
          # arcfw.xcf is an XCOFF with big-endian headers: f_magic 0x01DF, what the ROM's
          # xcoff-loader reads in the firmware's factory mode (src/stage0 switches to
          # little-endian itself; no NVRAM setting)
          test "$(head -c 2 build/arcfw.xcf | od -An -tx1 | tr -d ' ')" = 01df
          # the floppy carries nothing of Microsoft's: no such 8.3 directory entry on it
          for e in 'VENEER  EXE' 'VENEERD EXE' 'SETUPLDR   ' 'CIRRUS  SYS' 'CIRRUS  DLL' 'I8042PRTSYS' 'SETUP   OF '; do
            ! grep -aq "$e" build/boot-floppy.img || { echo "$e is on the floppy"; exit 1; }
          done
          for e in 'ARCFW   XCF' 'HALSHINRDLL' 'ADBPORT SYS' 'BOOT    OF ' 'BOOTDISKOF ' 'RESTORE OF '; do
            grep -aq "$e" build/boot-floppy.img || { echo "$e is missing from the floppy"; exit 1; }
          done
          # A PowerPC (little-endian) PE that NT's loader will accept: machine 0x01F0.
          python3 tools/pe-exports.py build/hal.dll | tee /tmp/pe.txt
          grep -q '01f0\|0x1f0' /tmp/pe.txt
          # Every name the shipped HALs export has to be present, or SETUPLDR cannot bind
          # the kernel to us.
          missing=0
          while read -r name; do
            case "$name" in ''|\#*) continue;; esac
            grep -qw "${name%% *}" /tmp/pe.txt || { echo "missing export: $name"; missing=1; }
          done < hal.exports
          test "$missing" = 0

      - name: Licence hygiene
        run: |
          set -e
          bad=0
          for f in src/*.c src/*.S src/arcfw/*.c src/arcfw/*.S src/arcfw/*.h src/arcfw/*.ld src/stage0/*.c src/stage0/*.S src/stage0/*.ld drivers/adbport/*.c drivers/adbport/*.h include/*.h tools/*.py Makefile hal.ld hal.exports hal.imports .github/workflows/*.yml; do
            head -6 "$f" | grep -q '^\(/\*\| \*\|#\) SPDX-License-Identifier: GPL-2.0-only$' \
              || { echo "$f: missing or malformed SPDX identifier (it must be alone on its line)"; bad=1; }
            head -6 "$f" | grep -q 'Copyright (C) 2026 powermac-nt-hal contributors' \
              || { echo "$f: no copyright line"; bad=1; }
          done
          # Nothing we may not redistribute, ever.
          for pat in halgoss.dll usbadb.sys atapimio.sys offrmbuf.sys HALEAGLE.DLL SETUPLDR VENEER.EXE; do
            find . -name "$pat" -not -path './.git/*' | grep . && { echo "$pat must never be committed"; bad=1; }
          done
          test "$bad" = 0

      - name: Rebuild from clean, byte for byte
        run: |
          cp build/hal.dll /tmp/hal-first.dll
          cp build/arcfw.xcf /tmp/arcfw-first.xcf
          cp build/boot-floppy.img /tmp/floppy-first.img
          make clean
          make
          make floppy
          cmp /tmp/hal-first.dll build/hal.dll
          cmp /tmp/arcfw-first.xcf build/arcfw.xcf
          cmp /tmp/floppy-first.img build/boot-floppy.img

      - uses: actions/upload-artifact@v4
        with:
          name: boot-floppy
          path: |
            build/boot-floppy.img
            build/hal.dll
            build/adbport.sys
            build/arcfw.xcf
          if-no-files-found: error
